.dj-drawer-foot { padding: var(--space-4) var(--space-5) calc(var(--space-4) + env(safe-area-inset-bottom)); border-top: var(--stroke-hair) solid var(--line); background: var(--surface-raised); }

/* Page layer on top of the DAJU Matcha system (tokens.css + bundle.css above).

   min-width queries add the desktop scroll story (pinned cup build, side-by-side chapters, top links). */
:root { color-scheme: light; --tabbar-h: 64px; --checkout-h: 0px; --bottom-ui: calc(var(--tabbar-h) + var(--checkout-h) + env(safe-area-inset-bottom, 0px)); }

.wrap { max-width: 1200px; margin: 0 auto; }
.band { padding-block: 48px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); color: var(--text); }
.eyebrow { margin: 0; text-transform: uppercase; color: var(--active); }
.muted { color: var(--text-muted); }
.p0 { margin: 0; }
.desk-only { display: none !important; }
.chapter-title { font-size: 34px !important; }

/* Touch feedback: hover lifts only where a real pointer hovers; a press squashes on touch */
@media (hover: none) {
  .dj-btn-sticker:hover, .dj-card:hover { transform: rotate(var(--dj-tilt, 0deg)); box-shadow: var(--shadow-sticker); }
  .dj-card:hover .dj-card-media { background: var(--surface-tint); }
  .dj-pill:hover { border-color: var(--line-strong); }
  .dj-btn-primary:hover { background: var(--accent); }
  .dj-btn-secondary:hover { background: transparent; }
}
.dj-btn:active, .dj-pill:active, .round-btn:active, .chip-btn:active, .tab:active, .step:active { transform: scale(.96); }
.dj-btn { transition: transform .1s ease, box-shadow .15s ease, background-color .15s ease; }
.dj-pill { min-height: 48px; }
.dj-input { font-size: 16px; min-height: 48px; }

/* Top bar: on phones it scrolls away (the bottom bar does the work); sticky on desktop */
.dj-nav { position: relative; top: auto; }
.dj-nav .dj-bag { display: none; }
.preview-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 10px; padding: 6px 16px; background: var(--color-foam); color: var(--color-ink); font-size: 12px; line-height: 17px; text-align: center; border-bottom: 1px solid var(--line); }
.preview-strip b { letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: var(--color-sticker); }

/* Bottom tab bar (phone) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--layer-checkout); display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; padding: 0 max(4px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(4px, env(safe-area-inset-left, 0px)); background: var(--surface-raised); border-top: 1px solid var(--line); box-shadow: var(--shadow-drawer); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 44px; border: 0; background: transparent; color: var(--text-muted); font: 600 11px/14px var(--font-sans); text-decoration: none; cursor: pointer; transition: color .15s, transform .1s; }
.tab .dj-doodle { transition: transform .2s; }

.tab.is-here::before { content: ""; position: absolute; top: 6px; width: 44px; height: 30px; border-radius: 15px; background: var(--surface-tint); z-index: -1; }
.tab:focus-visible { outline: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--focus); border-radius: 12px; }

.tab-count.bump { animation: bump .4s cubic-bezier(.2,.9,.3,1.4); }
@keyframes bump { 40% { transform: scale(1.45); } }
.dj-checkout { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); box-shadow: none; border-top: 1px solid var(--line); min-height: 68px; box-sizing: border-box; }

/* Ch.1 hero: headline and both actions fit the first phone screen */
.hero { position: relative; overflow: hidden; padding-block: 20px 40px; }

.hero-copy { min-width: 0; display: flex; flex-direction: column; gap: 18px; }

.hero-float { position: absolute; color: var(--doodle); pointer-events: none; opacity: .9; }
@media (prefers-reduced-motion: no-preference) {
  .draw path { stroke-dasharray: 140; animation: draw 1.4s .35s cubic-bezier(.6,.1,.3,1) both; }
  .hero-cup .dj-cup { animation: cupIn .9s .15s cubic-bezier(.2,.8,.2,1) both; }
}
@keyframes draw { from { stroke-dashoffset: 140; } to { stroke-dashoffset: 0; } }
@keyframes cupIn { from { transform: translateY(24px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Ch.2 cup build: phone = cup first, swipeable step chips under it */
.assembly { position: relative; }
.assembly-stick { padding-block: 48px 24px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.assembly-grid { width: 100%; display: flex; flex-direction: column; gap: 20px; }
.assembly-copy { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.assembly-stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stage-inner { position: relative; width: min(240px, 64vw); }
.steps { list-style: none; margin: 0 -16px; padding: 4px 16px 8px; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; width: calc(100% + 32px); box-sizing: border-box; }
.steps::-webkit-scrollbar { display: none; }

.step { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px 0 8px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface-raised); color: var(--text-muted); font: 600 15px/20px var(--font-sans); text-align: left; white-space: nowrap; transition: background-color .25s, color .25s, border-color .25s; }

.step-n { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); font-size: 13px; font-variant-numeric: tabular-nums; }
.step.is-done { color: var(--text); }
.step.is-done .step-n { background: var(--badge); border-color: var(--badge); color: var(--on-badge); }
.step.is-current { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step.is-current .step-n { background: var(--on-accent); border-color: var(--on-accent); color: var(--accent); }
.play-row { display: flex; gap: 8px; justify-content: center; }
.assembly-meter { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.assembly-meter span { display: block; height: 100%; background: var(--active); transform-origin: left; transition: transform .2s linear; }
@media (prefers-reduced-motion: no-preference) {
  .assembly .dj-cup-ice rect, .assembly .dj-cup-foam, .assembly .dj-cup-matcha, .assembly .dj-cup-milk, .assembly .dj-cup-swirl, .assembly .dj-cup-bow, .assembly .dj-cup-fly { transform-box: fill-box; transform-origin: 50% 50%; animation: layerIn .6s cubic-bezier(.2,.9,.3,1.2) both; }

}
@keyframes layerFade { from { opacity: 0; } }
@keyframes layerIn { from { opacity: 0; transform: translateY(-18px) scale(.8); } }
@keyframes swirlUp { from { opacity: 0; transform: translateY(40px); } }
.pin { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; }
.pin::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; border: 2px solid var(--seasalt-text); background: rgb(253 251 247 / .55); }
.pin:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
@media (prefers-reduced-motion: no-preference) { .pin::after { animation: pinPulse 2.2s ease-in-out infinite; } }
@keyframes pinPulse { 50% { transform: scale(1.25); opacity: .6; } }
.taste { display: block; max-width: 300px; margin: 0 auto; padding: 10px 14px; border: 2px solid var(--heading); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--heading); font: italic 500 19px/1.25 var(--font-editorial); box-shadow: var(--shadow-sticker); text-align: center; }

/* ---------- Soft motion: short (150–200ms) and medium (240–320ms) only ---------- */
.cup-tab, .step-btn, .back-btn, .chip-btn, .tab, .dot span, .ticket-state, .method-chip, .qty-row, .icon-btn { transition: background-color .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .15s ease, opacity .2s ease; }

.dj-chan, .dj-chan-col, .station-icon { transition: background-color .25s ease, box-shadow .25s ease, border-color .25s ease, color .25s ease; }
.studio-cup-meta .marker, .cup-tab-name { transition: color .2s ease; }
@media (prefers-reduced-motion: no-preference) {
  .qty-pop { display: inline-block; animation: qtyPop .24s cubic-bezier(.2,.9,.3,1.3) both; }
  .qty-badge { animation: qtyPop .24s cubic-bezier(.2,.9,.3,1.3) both; }
  .dj-checkout.is-entering { animation: barUp .26s cubic-bezier(.2,.8,.2,1) both; }
  .toast.is-leaving { animation: toastOut .2s ease both; }

  .dj-pill .dj-doodle, .chip-btn .dj-doodle { transition: transform .2s ease; }
  .dj-pill.is-on .dj-doodle { transform: scale(1.08); }
}
@keyframes qtyPop { from { transform: scale(.6); opacity: .3; } }
@keyframes barUp { from { transform: translateY(100%); } }
@keyframes toastOut { to { opacity: 0; transform: translate(-50%, 10px); } }

@keyframes sheetDown { to { transform: translateY(48px); opacity: 0; } }
@keyframes panelOut { to { transform: translateX(40px); opacity: 0; } }
@keyframes pageBack { from { opacity: 0; transform: translateX(-20px); } }

/* ---------- How to Order accordion: fold / unfold (medium, 320ms) ---------- */
.fold { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .32s cubic-bezier(.2,.8,.2,1), opacity .22s ease, margin-top .32s cubic-bezier(.2,.8,.2,1); }
.fold.is-open { grid-template-rows: 1fr; opacity: 1; transition: grid-template-rows .32s cubic-bezier(.2,.8,.2,1), opacity .26s ease .06s, margin-top .32s cubic-bezier(.2,.8,.2,1); }
.fold-inner { min-height: 0; overflow: hidden; }

@keyframes foldVisible { to { overflow: visible; } }

.station-bar { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--text); cursor: pointer; text-align: left; transition: background-color .2s ease, border-color .2s ease, transform .15s ease; }
.station-bar:active { transform: scale(.98); }

.station-bar-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 600 17px/1.2 var(--font-editorial); letter-spacing: .08em; text-transform: uppercase; color: var(--heading); }

@media (min-width: 721px) {

/* Menu category tabs */
.menu-tabs { display: inline-flex; gap: 4px; margin-top: 14px; padding: 4px; border-radius: var(--radius-pill); background: var(--surface-tint); }
.menu-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text); font: 700 15px/20px var(--font-sans); cursor: pointer; transition: background-color .25s ease, color .25s ease; }
.menu-tab.is-on { background: var(--heading); color: var(--surface); }
.menu-tab-n { min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: var(--surface-raised); color: var(--heading); font-size: 12px; line-height: 22px; text-align: center; }
.menu-tab:focus-visible { outline: 3px solid var(--focus, var(--active)); outline-offset: 2px; }

/* Photo cards: the real cup fills the card media */
.card-photo-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.dj-card-media:has(.card-photo-art) .dj-card-art { position: absolute; inset: 0; padding: 0; }

.card-soon { padding: 2px 10px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-pill); color: var(--text-muted); background: var(--surface-raised); font-size: 12px; }

/* Studio drink picker: swipeable chips on phones, a wrapping grid on desktop */
.drink-pick-wrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drink-pick { display: flex; gap: 8px; margin: 0 -16px; padding: 2px 16px 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
.drink-pick::-webkit-scrollbar { display: none; }
.drink-chip { flex: none; scroll-snap-align: start; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 14px 6px 6px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); background: var(--surface-raised); color: var(--text); text-align: left; cursor: pointer; transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease; }
.drink-chip.is-on { border-color: var(--heading); box-shadow: 0 0 0 2px var(--heading) inset; background: var(--surface); }
.drink-chip:disabled { opacity: .5; cursor: not-allowed; }
.drink-chip:focus-visible { outline: 3px solid var(--focus, var(--active)); outline-offset: 2px; }
.drink-thumb { flex: none; width: 42px; height: 42px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; background: var(--surface-tint); }
.drink-thumb-img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }

.drink-chip-text { display: flex; flex-direction: column; }
.drink-chip-name { font: 700 14px/18px var(--font-sans); color: var(--heading); white-space: nowrap; }

@media (min-width: 721px) {

}

  text-shadow: -1px -1px 0 var(--color-forest), 1px -1px 0 var(--color-forest), -1px 1px 0 var(--color-forest), 1px 1px 0 var(--color-forest), 0 -1.4px 0 var(--color-forest), 0 1.4px 0 var(--color-forest), -1.4px 0 0 var(--color-forest), 1.4px 0 0 var(--color-forest);

.motw-title-card { align-items: center; text-align: center; padding: 26px 18px; background: var(--color-forest); border-color: var(--color-forest); color: var(--color-cream, #fdfbf7); }

.boom-rays i:nth-child(3n+1) { background: var(--color-seasalt); }
.boom-sparks i { position: absolute; left: 0; top: 0; width: var(--bs); height: var(--bs); margin: calc(var(--bs) / -2); border-radius: 50%; opacity: 0; }
.boom-sparks i.is-ribbon { background: var(--color-ribbon); }
.boom-sparks i.is-seasalt { background: var(--color-seasalt); }
.boom-sparks i.is-whisk { background: var(--color-whisk, #a6d26b); border-radius: 2px; }
.boom-sparks i.is-doodle { background: var(--color-doodle, #f2c94c); border-radius: 2px; }
.motw-boom.is-on .price-tag { animation: tagZoom .7s cubic-bezier(.2, 1.6, .4, 1) both; }
.motw-boom.is-on .boom-rays i { animation: rayBurst .65s .08s cubic-bezier(.2,.8,.2,1) both; }
.motw-boom.is-on .boom-sparks i { animation: sparkFly .9s cubic-bezier(.15,.75,.25,1) both; }
@keyframes tagZoom { 0% { transform: translate(-50%, -50%) rotate(-30deg) scale(0); } 60% { transform: translate(-50%, -50%) rotate(-2deg) scale(1.18); } 100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); } }
@keyframes rayBurst { 0% { opacity: 1; transform: rotate(var(--r)) translateY(30px) scaleY(0); } 55% { opacity: 1; transform: rotate(var(--r)) translateY(110px) scaleY(1); } 100% { opacity: 0; transform: rotate(var(--r)) translateY(170px) scaleY(.2); } }
@keyframes sparkFly { 0% { opacity: 1; transform: translate(0, 0) scale(.4); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--bx), var(--by)) scale(1); } }

/* Reduced motion / not pinned: the story is a plain list under the cup */
.motw-static { display: flex; flex-direction: column; gap: 26px; width: min(360px, 100%); margin: 24px auto 0; }
.motw-static .motw-boom { position: relative; left: auto; top: auto; width: 100%; height: 150px; opacity: 1; visibility: visible; }
.motw-static .price-tag { left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-6deg); animation: none !important; }
.motw-static .boom-rays, .motw-static .boom-sparks { display: none; }
/* Price: text only, no tag shape (owner's request) */
.price-tag { padding: 0; min-width: 0; background: none; border: 0; border-radius: 0; box-shadow: none; clip-path: none; gap: 4px; }
.price-tag-kicker { color: var(--heading); font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--surface-raised); }
.price-tag-price { font-size: clamp(76px, 22vw, 112px); color: var(--color-ribbon, #f4b6c2); -webkit-text-stroke: 3px var(--color-forest); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--color-forest); letter-spacing: .01em; }
.price-tag-drink { color: var(--heading); font-size: 14px; font-weight: 700; opacity: 1; padding: 3px 10px; border-radius: 999px; background: var(--surface-raised); }
.motw-static .motw-boom { height: 190px; }
/* Hero: the real Blue Sea Salt cup, cut out */
.hero-cutout { display: block; width: min(250px, 64vw); height: auto; filter: drop-shadow(0 18px 22px rgb(0 0 0 / .35)); }
@media (min-width: 721px) { .hero-cutout { width: 300px; } }
@media (prefers-reduced-motion: no-preference) { .hero-cutout { animation: cupIn .9s .15s cubic-bezier(.2,.8,.2,1) both; } }
.hero-cutout { margin-top: 12px; }
/* Top bar: no status pill, logo centred */
.dj-nav.nav-centered { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
.dj-nav.nav-centered > .dj-nav-brand { grid-column: 2; grid-row: 1; justify-self: center; }
.dj-nav.nav-centered > span { grid-column: 1; grid-row: 1; }
.dj-nav.nav-centered > .dj-nav-right { grid-column: 3; grid-row: 1; justify-self: end; }
@media (min-width: 721px) { .dj-nav.nav-centered { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); } }
@media (min-width: 721px) and (max-width: 960px) { .dj-nav.nav-centered .dj-nav-links { display: none; } }
@media (min-width: 961px) and (max-width: 1100px) { .dj-nav.nav-centered .dj-nav-links a { padding: 0 8px; } }
/* Logo is just DA|JU everywhere (no "Matcha" line) */
.dj-wm-sub { display: none !important; }

/* Pop-ups section (above the footer) */
.popups-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
.popups-head { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.popup-card { position: relative; width: 100%; max-width: 460px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 32px 20px 22px; border-radius: var(--radius-lg); background: var(--surface-tint); border: 2px solid var(--color-forest); box-shadow: 6px 6px 0 var(--color-forest); }
.popup-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-3deg); padding: 6px 14px; border-radius: 999px; background: var(--color-ribbon); color: var(--color-forest); border: 2px solid var(--color-forest); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.popup-venue { margin: 0; font-family: var(--font-display); font-size: 34px; line-height: 1.05; color: var(--heading); }
.popup-place { margin: 0; font-family: var(--font-editorial); font-style: italic; font-size: 20px; color: var(--text); }
.popup-meta { list-style: none; margin: 14px 0 6px; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.popup-meta li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-md, 14px); background: var(--surface); line-height: 1.4; }
.popup-meta li > svg { flex: none; margin-top: 1px; color: var(--active); }
.popup-btns { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.popup-skip { margin: 4px 0 0; font-size: 14px; color: var(--muted, inherit); opacity: .85; }
.popup-card.is-empty { padding-top: 26px; }
.popup-later { width: 100%; max-width: 460px; text-align: left; }
.popup-later ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.popup-later li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--line); }
.popup-later-date { font-weight: 700; grid-column: 1; }
.popup-later li a { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.popup-follow { max-width: 460px; margin: 4px 0 0; font-size: 15px; line-height: 1.5; }
.popup-follow svg { vertical-align: -3px; }
.popup-follow svg { color: var(--active); }
.popup-follow a { color: var(--heading); font-weight: 700; }
@media (min-width: 721px) { .popup-venue { font-size: 44px; } .popup-card { padding: 40px 32px 26px; } }

/* How to order: pink as the tertiary colour (step numbers, weekend tags, icons on the route, the sprig) */
#order { --pink: var(--color-ribbon); }
#order .route-head .dj-doodle, #order .route-head > svg { color: var(--pink); }
#order .route-head .caption { color: var(--pink); opacity: .9; }
#order .dj-chan-step { background: var(--pink); color: var(--color-forest); }
#order .dj-chan-col:not(.is-active) .dj-chan-badge { background: var(--pink); color: var(--color-forest); }
#order .station-icon { color: var(--pink); }
#order .station.is-chosen .station-icon, #order .rider { background: var(--pink); color: var(--color-forest); }
#order .dj-chan.is-selected { border-color: var(--pink); box-shadow: 4px 4px 0 var(--pink); }
#order .chip-btn[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: var(--color-forest); }
#order .details-form .eyebrow { color: var(--pink); }

/* Pink "add to bag" buttons (forest text keeps it readable on the light pink) */
.dj-btn.btn-pink { background: var(--color-ribbon); color: var(--color-forest); border-color: var(--color-forest); }
.dj-btn.btn-pink:hover { background: #eea3b2; }

/* Checkout drawers: pink as the tertiary colour */
.checkout-drawer .dj-drawer-head { border-bottom: 3px solid var(--color-ribbon); }
.checkout-drawer .dj-drawer-step { display: inline-block; margin-bottom: 6px; padding: 2px 10px; border-radius: 999px; background: var(--color-ribbon); color: var(--color-forest); }
.checkout-drawer .bag-item { border-left: 4px solid var(--color-ribbon); }
.checkout-drawer .method-summary-icon { background: var(--color-ribbon); color: var(--color-forest); }
.checkout-drawer .dj-drawer-foot { border-top: 2px dashed var(--color-ribbon); }
.checkout-drawer .sum-row span:last-child { padding: 0 8px; border-radius: 6px; background: rgb(244 182 194 / .45); }

/* Hero "Matcha of the Week" tag in pink */
.dj-stamp.stamp-pink, #menu .dj-card-stamp { background: var(--color-ribbon); color: var(--color-forest); border-color: var(--color-forest); }

      }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      el.addEventListener('scroll', on, { passive: true });
      return function () { el.removeEventListener('scroll', on); clearTimeout(t); };

  var POPUPS = [
    { start: '2026-11-21', end: '2026-11-22', days: 'Sat 21 – Sun 22 Nov', time: '10 AM – 8 PM', venue: 'Palm Square', place: 'Centre Point, Kota Kinabalu' }

  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function popBadge(pu, today) {

    var days = Math.round((new Date(pu.start + 'T00:00:00') - new Date(today + 'T00:00:00')) / 86400000);
    if (days === 1) return 'Tomorrow';

    if (days <= 13) return 'Next week';
    return 'Coming up';
  }

      customer: liveOrder.customer || '[Your name]', phone: liveOrder.phone || '[Your phone]',
      location: liveOrder.location || (f.mode === 'PICK_UP' ? sch.location : '[Your address]'),
      items: ticketItems(shown), subtotal: subtotalText(shown) });
    var detailsComplete = saved && !Object.keys(errors).length;

    var slotLine = MODE_NAME[f.mode] + ' · ' + (f.mode === 'PICK_UP' ? sch.location + ' · ' : '') + (f.mode === 'PICK_UP' && f.day === 'weekend' ? 'Time by arrangement' : when);

    return html`
      <div id="top">
        <div className="preview-strip"><b>Website preview</b><span>Prices and social handles are placeholders until the menu is final.</span></div>
        <${D.NavBar} className="nav-centered" bagCount=${bag.length} onBag=${function () { setDrawer('bag'); }} />
        <main>
          <${Hero} narrow=${narrow} heroRef=${heroRef} onCustomize=${function (m) { setCustItem(m); setDrawer('custom'); }} />
          <${Assembly} narrow=${narrow} reduce=${reduce} pinned=${pinned} layer=${layer} setLayer=${setLayer} progress=${progress} secRef=${secRef} stickRef=${stickRef} />
          <${Menu} narrow=${narrow} onCustomize=${function (m) { setCustItem(m); setDrawer('custom'); }} />
          <${Studio} narrow=${narrow} studio=${studio} setCup=${setCup} setQty=${setQty} setMode=${setStudioMode} setActive=${function (i) { setStudio(function (st) { return Object.assign({}, st, { active: i }); }); }} setDrink=${function (id) { setStudio(function (st) { return Object.assign({}, st, { drink: id }); }); }} burst=${burst} bagCount=${bag.length}
            onAdd=${function () { var l = studioCups(); addItems(studioDrink, l); showToast(l.length === 1 ? 'Added to your bag' : 'Added ' + l.length + ' cups to your bag'); }} />
          <${Route} day=${day} setDay=${setDay} mode=${f.mode} saved=${saved} step=${orderStep} onChoose=${chooseMethod}
            onBack=${function () { buzz(); followHeader(f.mode, 420); setOrderStep('pick'); }}
            f=${f} setF=${setF} tried=${secTried} errors=${errors} now=${now}
            onSave=${function () { setSecTried(true); if (Object.keys(errors).length) { buzz(); return; } setSaved(true); setOrderStep('pick'); setFlash(function (n) { return n + 1; }); showToast('Details saved to your ticket'); scrollToId('ticket'); }} />
          <${SignOff} order=${pageOrder} hasBag=${bag.length > 0} complete=${detailsComplete} flash=${flash} studioQty=${studio.qty} toast=${showToast}
            onDetails=${function () { chooseMethod(f.mode); }}
            onReview=${function () { setDrawer('bag'); }}
            onAddStudio=${function () { addItems(studioDrink, studioCups()); setDrawer('bag'); }}
            onCopy=${function () { copyText(orderMessage(pageOrder), function () { showToast('Ticket copied'); }, function () { showToast('Copy is blocked here. Open your bag to select the text.'); }); }} />
          <${PopUps} onPreorder=${function () { scrollToId('studio'); }} />
        </main>
        <${Footer} />
        ${narrow ? html`<${TabBar} count=${bag.length} onBag=${function () { buzz(); setDrawer('bag'); }} />` : null}
        ${bag.length && narrow && !drawer ? html`<${D.CheckoutBar} className="is-entering" count=${bag.length} total=${subtotalText(bag)} slot=${slotLine} onCheckout=${function () { setDrawer('bag'); }} />` : null}

        <${CustomizeDrawer} open=${drawer === 'custom'} item=${custItem} side=${side} onClose=${function () { closeDrawer(); }}
          onAdd=${function (m, c) { addItem(m, c); closeDrawer(); showToast('Added to your bag'); }} />
        <${BagDrawer} open=${drawer === 'bag'} side=${side} items=${bag} onClose=${function () { closeDrawer(); }}
          onRemove=${function (k) { setBag(function (b) { return b.filter(function (x) { return x.key !== k; }); }); }}
          onBrowse=${function () { closeDrawer(); setTimeout(function () { var m = document.getElementById('menu'); if (m) m.scrollIntoView(); }, 0); }}
          onNext=${function () { setTried(false); setDrawer('fulfill'); }}
          ready=${detailsComplete} saved=${saved} modeName=${MODE_NAME[f.mode]} modeIcon=${{ PICK_UP: 'bag', GRAB_EXPRESS: 'scooter', COD: 'car' }[f.mode]}
          slot=${(f.mode === 'PICK_UP' ? sch.location : where) + ' · ' + when}
          onReview=${function () { buzz(); setDrawer('ticket'); }} />
        <${FulfillDrawer} open=${drawer === 'fulfill'} side=${side} f=${f} setF=${setF} tried=${tried} errors=${errors} now=${now}
          onClose=${function () { closeDrawer(); }} onBack=${function () { setDrawer('bag'); }}
          onNext=${function () { setTried(true); if (!Object.keys(errors).length) { setSaved(true); setDrawer('ticket'); } }} />
        <${TicketDrawer} open=${drawer === 'ticket'} side=${side} order=${liveOrder} toast=${showToast}
          onClose=${function () { closeDrawer(); }} onBack=${function () { setDrawer('fulfill'); }} />
        <${Toast} msg=${toast} out=${toastOut} />
      </div>`;
  }

  /* ---------- Soft layout motion (FLIP) ----------
     Whenever the DOM changes, children of these containers that moved glide from their old spot (240ms),
     and newly added children fade and rise in (200ms). Nothing runs under prefers-reduced-motion. */
  var FLIP_SEL = '.studio-form, .studio, .studio-add, .qty-row, .cup-tabs-wrap, .studio-cup-meta, .details-form, ' +
    '.dj-drawer-body, .drawer-stack, .bag-list, .dj-tk-meta, .dj-tk-items, .dj-ticket, .signoff-ticket, .btns, .dj-zones, .dj-fee, .dj-field, .assembly-stage, ' +
    '.hero-actions, .dj-notice-body, .play-row, .empty';
  var EASE = 'cubic-bezier(.2,.8,.2,1)';
  function startFlip() {
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    var cache = new WeakMap(), ready = false, busy = false, active = 0;
    function kids() {
      var out = [];
      document.querySelectorAll(FLIP_SEL).forEach(function (c) { for (var i = 0; i < c.children.length; i++) out.push([c, c.children[i]]); });
      return out;
    }
    function rel(c, el) { var a = el.getBoundingClientRect(), b = c.getBoundingClientRect(); return { x: a.left - b.left + c.scrollLeft, y: a.top - b.top + c.scrollTop, w: a.width, h: a.height }; }
    function pinned(el) { var p = getComputedStyle(el).position; return p === 'sticky' || p === 'fixed'; }
    function snapshot() { kids().forEach(function (k) { if (k[1].isConnected) cache.set(k[1], { c: k[0], r: rel(k[0], k[1]) }); }); }
    function pass() {
      if (busy) return; busy = true;
      var reduce = mq && mq.matches;
      kids().forEach(function (k) {
        var c = k[0], el = k[1];
        if (el.offsetParent === null || pinned(el)) return;
        var prev = cache.get(el);
        if (el._flipIn) { cache.set(el, { c: c, r: rel(c, el) }); return; }   // let a fade-in finish
        var start = prev && prev.c === c ? prev.r : null;
        if (el._flip) { start = rel(c, el); el._flip.cancel(); el._flip = null; } // continue from where it is on screen
        var now = rel(c, el);
        if (!reduce && ready) {
          if (!start) {
            if (!el.classList.contains('no-flip')) {
              el._flipIn = el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: EASE });
              active++; el._flipIn.onfinish = el._flipIn.oncancel = (function (e) { return function () { e._flipIn = null; active--; }; })(el);
            }
          } else {
            var dx = start.x - now.x, dy = start.y - now.y;
            if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
              el._flip = el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: Math.min(320, 180 + Math.hypot(dx, dy) * 0.4), easing: EASE });
              active++; el._flip.onfinish = el._flip.oncancel = (function (e) { return function () { e._flip = null; active--; }; })(el);
            }
          }
        }
        cache.set(el, { c: c, r: now });
      });
      busy = false;
    }
    var pending = false;
    var mo = new MutationObserver(function () { if (pending) return; pending = true; Promise.resolve().then(function () { pending = false; pass(); }); });
    mo.observe(document.getElementById('root'), { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['class', 'aria-pressed', 'checked'] });
    var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(snapshot, 150); });
    document.fonts && document.fonts.ready.then(snapshot);
    setTimeout(function () { snapshot(); ready = true; }, 600);
    setInterval(function () { if (!document.hidden && active <= 0) { active = 0; snapshot(); } }, 1500);
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  if ('MutationObserver' in window && Element.prototype.animate) startFlip();
})();

</script>
